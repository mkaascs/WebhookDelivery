openapi: 3.0.3

info:
  title: Webhook Delivery
  description: An open-source webhook delivery service in Go
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: endpoints
  - name: subscriptions
  - name: events
  - name: deliveries

paths:
  /endpoints:
    get:
      tags: [endpoints]
      operationId: GetAllEndpoints
      summary: List endpoints
      description: Returns a paginated list of endpoints. Missing pagination params fall back to defaults.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEndpointsResponse'
        '400':
          description: invalid pagination params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [endpoints]
      operationId: RegisterEndpoint
      summary: Register a webhook endpoint
      description: Registers a receiver URL and returns its generated signing secret. The URL is SSRF-validated (loopback / link-local / localhost are rejected).
      requestBody:
        description: Endpoint to register
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEndpointRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEndpointResponse'
        '400':
          description: invalid url or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/EndpointID'
    get:
      tags: [endpoints]
      operationId: GetEndpoint
      summary: Get an endpoint by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEndpointResponse'
        '404':
          description: endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [endpoints]
      operationId: UpdateEndpoint
      summary: Update an endpoint
      description: Partially updates the URL, active state or description. An empty body is treated as a no-op. If a URL is provided it is SSRF-validated.
      requestBody:
        description: Fields to update (all optional)
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: invalid url or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [endpoints]
      operationId: DeleteEndpoint
      summary: Delete an endpoint
      responses:
        '204':
          description: No Content
        '404':
          description: endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /endpoints/{id}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/EndpointID'
    get:
      tags: [subscriptions]
      operationId: GetAllSubscriptions
      summary: List an endpoint's subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllSubscriptionsResponse'
        '404':
          description: endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [subscriptions]
      operationId: Subscribe
      summary: Subscribe an endpoint to event types
      description: Adds subscriptions for the given event types. Idempotent — event types the endpoint is already subscribed to are ignored.
      requestBody:
        description: Event types to subscribe to
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeResponse'
        '400':
          description: event types not provided or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: subscription already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription ID
        schema:
          type: string
          minLength: 1
    delete:
      tags: [subscriptions]
      operationId: DeleteSubscription
      summary: Delete a subscription
      responses:
        '204':
          description: No Content
        '404':
          description: subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events:
    post:
      tags: [events]
      operationId: PublishEvent
      summary: Publish an event
      description: Publishes an event and fans it out to subscribed endpoints, creating a pending delivery for each. Returns immediately with the number of deliveries created.
      requestBody:
        description: Event to publish
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishEventResponse'
        '400':
          description: event type is empty or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      tags: [events]
      operationId: GetEvent
      summary: Get an event by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventResponse'
        '404':
          description: event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/EventID'
    get:
      tags: [deliveries]
      operationId: GetEventDeliveries
      summary: List an event's deliveries
      description: Returns the paginated deliveries created for an event.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventDeliveriesResponse'
        '400':
          description: invalid pagination params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /deliveries/{id}:
    parameters:
      - $ref: '#/components/parameters/DeliveryID'
    get:
      tags: [deliveries]
      operationId: GetDelivery
      summary: Get a delivery by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeliveryResponse'
        '404':
          description: delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /deliveries/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/DeliveryID'
    post:
      tags: [deliveries]
      operationId: RetryDelivery
      summary: Retry a delivery
      description: Resets a delivery to pending and re-queues it for immediate delivery, even if the endpoint is currently inactive.
      responses:
        '202':
          description: Accepted
        '404':
          description: delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number (from 1, default 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1-100, default 10)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    EndpointID:
      name: id
      in: path
      required: true
      description: Endpoint ID
      schema:
        type: string
        minLength: 1
    EventID:
      name: id
      in: path
      required: true
      description: Event ID
      schema:
        type: string
        minLength: 1
    DeliveryID:
      name: id
      in: path
      required: true
      description: Delivery ID
      schema:
        type: string
        minLength: 1

  schemas:
    # ---------- common ----------
    Error:
      type: object
      required:
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: invalid_url
        message:
          type: string
          description: Human-readable error message
          example: invalid url

    # ---------- endpoints ----------
    EndpointInfo:
      type: object
      required:
        - id
        - url
        - description
        - is_active
        - event_types
        - created_at
      properties:
        id:
          type: string
          example: ep_1a2b3c
        url:
          type: string
          example: https://example.com/webhooks
        description:
          type: string
          example: Billing webhook
        is_active:
          type: boolean
          example: true
        event_types:
          type: array
          items:
            type: string
          example:
            - order.created
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'

    GetAllEndpointsResponse:
      type: object
      required:
        - endpoints
        - page
        - limit
        - total
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointInfo'
        page:
          type: integer
          description: Current page (from 1)
          example: 1
        limit:
          type: integer
          description: Page size
          example: 10
        total:
          type: integer
          description: Total number of endpoints
          example: 42

    GetEndpointResponse:
      $ref: '#/components/schemas/EndpointInfo'

    RegisterEndpointRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          description: Receiver URL (http/https, must not be private)
          example: https://example.com/webhooks
        description:
          type: string
          description: Optional human-readable description
          example: Billing webhook
        event_types:
          type: array
          description: Event types to subscribe to on creation
          items:
            type: string
            minLength: 1
          example:
            - order.created

    RegisterEndpointResponse:
      type: object
      required:
        - id
        - url
        - secret
        - is_active
        - event_types
        - created_at
      properties:
        id:
          type: string
          description: Generated endpoint ID
          example: ep_1a2b3c
        url:
          type: string
          description: Receiver URL
          example: https://example.com/webhooks
        secret:
          type: string
          description: Signing secret (returned once, on creation)
          example: whsec_3f9a1c2e8d
        is_active:
          type: boolean
          description: Whether the endpoint is active
          example: true
        event_types:
          type: array
          description: Subscribed event types
          items:
            type: string
          example:
            - order.created
        created_at:
          type: string
          description: Creation timestamp
          format: date-time
          example: '2026-07-01T12:00:00Z'

    UpdateEndpointRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          description: New receiver URL (SSRF-validated if present)
          example: https://example.com/webhooks
        is_active:
          type: boolean
          description: Pause or resume the endpoint
          example: false
        description:
          type: string
          description: New description
          example: Billing webhook

    # ---------- subscriptions ----------
    SubscriptionInfo:
      type: object
      required:
        - id
        - endpoint_id
        - event_type
        - created_at
      properties:
        id:
          type: string
          example: sub_1a2b3c
        endpoint_id:
          type: string
          example: ep_1a2b3c
        event_type:
          type: string
          example: order.created
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'

    GetAllSubscriptionsResponse:
      type: object
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionInfo'

    SubscribeRequest:
      type: object
      required:
        - event_types
      properties:
        event_types:
          type: array
          minItems: 1
          description: Event types to subscribe the endpoint to
          items:
            type: string
            minLength: 1
          example:
            - order.created

    SubscribeResponse:
      type: object
      required:
        - endpoint_id
        - subscriptions
      properties:
        endpoint_id:
          type: string
          example: ep_1a2b3c
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionInfo'

    # ---------- events ----------
    PublishEventRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          minLength: 1
          description: Event type
          example: order.created
        payload:
          type: object
          description: Arbitrary JSON payload delivered to subscribers
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true

    PublishEventResponse:
      type: object
      required:
        - id
        - type
        - deliveries_created
        - created_at
      properties:
        id:
          type: string
          example: ev_1a2b3c
        type:
          type: string
          example: order.created
        deliveries_created:
          type: integer
          description: Number of pending deliveries created for subscribers
          example: 3
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'

    GetEventResponse:
      type: object
      required:
        - id
        - type
        - payload
        - created_at
      properties:
        id:
          type: string
          example: ev_1a2b3c
        type:
          type: string
          example: order.created
        payload:
          type: object
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'

    # ---------- deliveries ----------
    DeliveryInfo:
      type: object
      required:
        - id
        - event_id
        - endpoint_id
        - status
        - attempts
        - max_attempts
        - next_retry_at
        - created_at
      properties:
        id:
          type: string
          example: del_1a2b3c
        event_id:
          type: string
          example: ev_1a2b3c
        endpoint_id:
          type: string
          example: ep_1a2b3c
        status:
          type: string
          enum: [pending, processing, delivered, failed]
          example: pending
        attempts:
          type: integer
          example: 1
        max_attempts:
          type: integer
          example: 5
        last_response_code:
          type: integer
          description: Status code of the last delivery attempt, if any
          example: 500
        last_error:
          type: string
          description: Error text of the last failed attempt, if any
          example: HTTP 500
        next_retry_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'

    GetDeliveryResponse:
      type: object
      required:
        - delivery
      properties:
        delivery:
          $ref: '#/components/schemas/DeliveryInfo'

    GetEventDeliveriesResponse:
      type: object
      required:
        - deliveries
        - total
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryInfo'
        total:
          type: integer
          description: Total number of deliveries for the event
          example: 3
