env: "dev" #prod, dev
http_server:
  port: 8080
  write_timeout: 5s
  read_timeout: 10s
db:
  addr: "postgres:5432"
  connection_timeout: 5s
workers:
  max_goroutines: 5
  max_attempts: 8
  timeout: 10s
  base_backoff: 10s
  max_backoff: 1h
  queue_size: 20
dispatcher:
  interval: 4s
  batch_size: 20